name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          # Ensure Android SDK licenses are accepted
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Secrets, Keystore & Google Services
        run: |
          # 1. Ensure .env exists for Secrets Gradle Plugin
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

          # 2. Decode debug.keystore from base64 if present
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # 3. Validate debug.keystore with keytool; generate fresh if missing or invalid
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "Keystore is missing or invalid. Generating a fresh debug.keystore..."
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Valid debug.keystore confirmed."
          fi

          # Replicate to standard lookup paths (root, app/, and user home)
          mkdir -p ~/.android app
          cp debug.keystore ~/.android/debug.keystore || true
          cp debug.keystore app/debug.keystore || true

          # 4. Ensure google-services.json exists across all target lookup locations
          if [ ! -f app/google-services.json ]; then
            echo "Generating fallback google-services.json..."
            mkdir -p app
            echo '{"project_info":{"project_number":"123456789012","project_id":"synapse-local-app","storage_bucket":"synapse-local-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef0123456789","android_client_info":{"package_name":"com.aistudio.edgellm.vrmqpt"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

          mkdir -p app/src/debug app/src/main
          cp app/google-services.json app/src/google-services.json || true
          cp app/google-services.json app/src/debug/google-services.json || true
          cp app/google-services.json app/src/main/google-services.json || true

          echo "Prerequisites verified:"
          ls -la debug.keystore app/google-services.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: synapse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
